[package]
name = "radar_native"
version = "0.1.0"
edition = "2021"
description = "Native (Rust) accelerated kernels for the Slovenia radar backend"

[lib]
crate-type = ["cdylib"]

# No external crates: builds fully offline in the Docker stage.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
