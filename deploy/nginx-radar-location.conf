# Add these two blocks INSIDE the existing 443 server block in
#   /home/cloudy/nextcloud/nginx.conf   (server_name cloudy.freemyip.com)
# right after the "location /spin/ { ... }" block. Do NOT add a new server{}.
# Reachs the radar container's published port via the host gateway 172.18.0.1,
# exactly like /spin, /relay and /admin.

    location /radar/ {
        proxy_pass http://172.18.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # heavy products (VIL / accumulation) ~20s cold
    }
    location = /radar { return 301 /radar/; }
